; ═══════════════════════════════════════════════════════════════
;  CHIRON RISING — LLM diplomacy for SMACX
; ═══════════════════════════════════════════════════════════════
;
; Faction leaders speak lines written on the spot by a local model instead of
; the ~1500 canned strings in xscript.txt. The engine's logic is untouched: the
; same demand is made, the same buttons appear, the same outcome follows. Only
; the wording changes.
;
; Requires chiron-bridge running on the host:
;     ~/chiron-smacx/bridge/chiron-bridge.py
;
; If the bridge is down, the model is slow, or the reply loses a placeholder,
; the game silently shows its original text. There is no failure mode where a
; dialogue box comes up empty.

; Master switch. 0 restores stock Thinker behaviour completely.
enabled=1

; Where chiron-bridge is listening. Wine reaches the Linux host on loopback.
host=127.0.0.1
port=11436

; How long to wait for a generated line before giving up and using the vanilla
; text. The game is single-threaded, so this is a visible pause on the dialogue.
; Measured round trip against synapd's 7B is ~2s; 8s leaves headroom for a cold
; model load without making a stall feel like a hang.
timeout_ms=8000

; Output budget. A diplomacy box holds about six short lines, so this is a cap on
; damage rather than a target: the game blocks for the whole generation, and a
; local 7B sampled greedily will happily repeat itself until it runs out of room.
; At 320 Lal restated the same commendation seven times and the box still ended
; mid-word. 110 is a paragraph, which is all these popups ever held.
max_tokens=110

; Name new bases from the faction's own culture rather than the fixed list in
; basenames/. Names are generated a dozen at a time and drawn from a pool, so
; the cost is a handful of pauses across a whole game rather than one per base
; -- which matters because the AI factions found bases during turn processing.
; The faction's shipped names are shown to the model as the house style, so a
; Hive base still sounds like the Hive. 0 restores the vanilla lists.
base_names=1

; Write chiron.txt in the game folder: every label, whether it was rewritten,
; and why anything was rejected. Turn on when tuning, off for play.
debug=1
